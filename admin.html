<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mesajlar – Yönetici</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#FBF7EF;--sand:#EFE3CF;--gold:#C9A468;--gold-deep:#A9793C;--stone:#8B857C;--ink:#3A342B;--card:#fff;--line:#EADFC9;}
@media (prefers-color-scheme:dark){:root{--cream:#14110D;--sand:#2A241B;--card:#1C1814;--ink:#F3ECE0;--stone:#B8AF9F;--line:#3A3226;}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;padding:24px 16px 60px}
.wrap{max-width:640px;margin:0 auto}
h1{font-family:'Playfair Display',serif;font-weight:500;font-size:1.7rem;text-align:center;margin:20px 0 6px}
.sub{text-align:center;color:var(--stone);font-size:.85rem;margin-bottom:26px}
.btn{font-family:inherit;font-size:.85rem;padding:11px 24px;border-radius:100px;border:1px solid var(--gold);background:var(--gold);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--gold-deep)}
.btn.small{padding:6px 14px;font-size:.72rem}
.center{text-align:center}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;font-size:.8rem;color:var(--stone)}
.count{font-weight:500;color:var(--gold-deep)}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.name{font-weight:500;font-size:.9rem;color:var(--gold-deep)}
.msg{font-size:.9rem;margin-top:6px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:.68rem;color:var(--stone)}
.del{background:none;border:none;color:#B5544A;cursor:pointer;font-family:inherit;font-size:.72rem}
.empty,.err{text-align:center;padding:30px 10px;color:var(--stone);font-size:.9rem}
.err{color:#B5544A}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Gelen Mesajlar 💌</h1>
  <p class="sub">Yalnızca yönetici görebilir</p>

  <div id="loginBox" class="center">
    <button class="btn" id="loginBtn">Google ile giriş yap</button>
    <p class="err hidden" id="loginErr"></p>
  </div>

  <div id="panel" class="hidden">
    <div class="bar">
      <span id="who"></span>
      <span><span class="count" id="count">0</span> mesaj &nbsp; <button class="btn ghost small" id="logoutBtn">Çıkış</button></span>
    </div>
    <div id="list"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCmrWZIwXfPew94AF4cCvgYko1qBQiu0WY",
  authDomain: "esrafatih.firebaseapp.com",
  projectId: "esrafatih",
  storageBucket: "esrafatih.firebasestorage.app",
  messagingSenderId: "205617248401",
  appId: "1:205617248401:web:646d29a2c559691435e730"
};
// Kendi Google hesabının e-postası (küçük harfle). Asıl güvenlik firestore.rules içindeki aynı e-posta ile sağlanır.
const ADMIN_EMAIL = "fmg237082@gmail.com";

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();
const $ = id => document.getElementById(id);
let unsub = null;

function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}

$('loginBtn').onclick = async () => {
  $('loginErr').classList.add('hidden');
  try{ await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
  catch(e){ showErr('Giriş yapılamadı: ' + (e.code || e.message)); }
};
$('logoutBtn').onclick = () => auth.signOut();

function showErr(t){ const el=$('loginErr'); el.textContent=t; el.classList.remove('hidden'); }

auth.onAuthStateChanged(user => {
  if(unsub){ unsub(); unsub = null; }
  if(!user){
    $('panel').classList.add('hidden'); $('loginBox').classList.remove('hidden'); return;
  }
  if((user.email||'').toLowerCase() !== ADMIN_EMAIL.toLowerCase()){
    auth.signOut(); showErr('Bu hesabın yetkisi yok: ' + user.email); return;
  }
  $('loginBox').classList.add('hidden'); $('panel').classList.remove('hidden');
  $('who').textContent = user.email;
  unsub = db.collection('messages').orderBy('time','desc').onSnapshot(snap => {
    $('count').textContent = snap.size;
    if(snap.empty){ $('list').innerHTML = '<div class="empty">Henüz mesaj yok.</div>'; return; }
    $('list').innerHTML = snap.docs.map(d => {
      const e = d.data();
      const t = e.time ? e.time.toDate().toLocaleString('tr-TR') : 'şimdi';
      return `<div class="item"><div class="name">${esc(e.name||'')}</div>
        <div class="msg">${esc(e.msg||'')}</div>
        <div class="meta"><span>${t}</span><button class="del" data-id="${d.id}">Sil</button></div></div>`;
    }).join('');
  }, err => {
    $('list').innerHTML = '<div class="err">Mesajlar okunamadı (yetki/kurallar): ' + esc(err.code||err.message) + '</div>';
  });
});

$('list').addEventListener('click', e => {
  const b = e.target.closest('.del'); if(!b) return;
  if(confirm('Bu mesaj silinsin mi?')) db.collection('messages').doc(b.dataset.id).delete();
});
</script>
</body>
</html>
